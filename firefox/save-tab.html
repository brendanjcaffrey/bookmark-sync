<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Save Bookmark</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        font-size: 13px;
        color: #1a1a1a;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #555;
        margin-bottom: 4px;
      }
      input[type="text"],
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 12px;
        background: white;
      }
      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: #0060df;
      }
      .url {
        font-size: 11px;
        color: #666;
        word-break: break-all;
        margin: -6px 0 12px;
      }
      .error {
        color: #b3261e;
        font-size: 12px;
        min-height: 14px;
        margin-bottom: 8px;
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      button {
        padding: 6px 14px;
        font-size: 13px;
        border-radius: 4px;
        border: 1px solid #ccc;
        background: #f6f6f6;
        cursor: pointer;
      }
      button.primary {
        background: #0060df;
        color: white;
        border-color: #0060df;
      }
      button.primary:hover {
        background: #003eaa;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <form id="form">
      <label for="title">Title</label>
      <input type="text" id="title" required />
      <div class="url" id="url"></div>
      <label for="group">Group</label>
      <select id="group">
        <option value="bar">Bookmarks Toolbar</option>
        <option value="other">Other Bookmarks</option>
      </select>
      <div class="error" id="error"></div>
      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary" id="save">Save</button>
      </div>
    </form>
    <script src="save-tab.js"></script>
  </body>
</html>
